<title>counterparts — the owner's window</title>

<!-- The server fills this with a per-launch token; every management action
     echoes it (web/actions.ts). Empty means this page cannot act. -->
<meta name="counterparts-action-token" content="">
<!--
  The shell. Styles and scripts are modules served beside this file (see
  README.md): no web fonts, no CDN, no network of any kind beyond this origin.
  The <link> order IS the cascade order — it reproduces the one stylesheet this
  page used to inline, so a rule's position still decides its ties.
-->
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/widgets/tiles.css">
<link rel="stylesheet" href="/shared/layout.css">

<link rel="stylesheet" href="/pages/mind/mind.css">

<body>
<div class="wrap">
  <header>
    <h1>counterparts</h1>
    <nav id="nav"></nav>
    <div class="hright">
      <span class="badge ok" title="it strengthens nothing, deposits nothing, and writes no file of its own"><span class="wide">read-only · </span>observer</span>
      <span class="badge dirpath" id="dir" title="the data directory this window is reading">…</span>
      <a href="/brain" title="the same machinery, mapped to a rough anatomy">brain</a>
      <span class="badge" id="clock" title="the store's own clock — lived days, the unit everything else here is measured in">…</span>
      <span class="badge" id="seen" hidden></span>
    </div>
  </header>

  <div class="empty" id="err"></div>

  <!-- One section per page; each page module (pages/<name>/index.js) writes
       its own markup into its section at load. -->
  <section class="tab" id="tab-overview"></section>
  <section class="tab" id="tab-memories" hidden></section>
  <section class="tab" id="tab-mind" hidden></section>
  <section class="tab" id="tab-flow" hidden></section>
