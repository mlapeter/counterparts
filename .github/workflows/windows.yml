# Windows, through the front door (W1, 2026-11-09): the package a stranger gets
# from npm, installed and connected on native Windows and inside WSL.
#   - pack: `npm pack` once, on Linux (a Windows checkout would carry CRLF line
#     endings into the shell-script half of the bins); both jobs below take
#     that one file.
#   - windows (node 22.15 / 24): tools/door/npm-door.mjs on windows-latest —
#     npm install -g, `counterparts --version` from PowerShell, cmd and Git
#     Bash, Claude Code installed from npm (`claude.cmd`), install + connect
#     typed in PowerShell, `claude mcp list` (Claude Code starts the server),
#     one hook round in Git Bash and SessionStart in PowerShell, a memory
#     written and recalled through the registered server and the console, the
#     background worker, doctor, and (the runner's clock moved a day) the night
#     starting and reaching `claude -p`.
#   - wsl: the same script inside Ubuntu on WSL 2, with Node from nodejs.org.
# Hermetic: every step runs in a temp HOME/USERPROFILE outside the runner's home,
# and COUNTERPARTS_REQUIRE_EXPLICIT_DIR=1 holds for everything not inside it.
name: windows

on:
  pull_request:
    paths:
      - "src/**"
      - "tools/door/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows.yml"
  push:
    branches: [master, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COUNTERPARTS_REQUIRE_EXPLICIT_DIR: "1"

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Pack once
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          tarball=$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP/pack")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          sha256sum "$RUNNER_TEMP/pack/$tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-door-tarball
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  windows:
    name: windows (node ${{ matrix.node }})
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.15.0", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-door-tarball
          path: ${{ runner.temp }}/pack
      - name: The npm door, on native Windows
        shell: pwsh
        run: |
          node --version
          node tools/door/npm-door.mjs "$env:RUNNER_TEMP\pack\${{ needs.pack.outputs.tarball }}" "$env:RUNNER_TEMP\door" --advance-clock

  wsl:
    name: wsl (ubuntu 24.04)
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-door-tarball
          path: ${{ runner.temp }}/pack
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl ca-certificates xz-utils
      - name: The npm door, inside WSL
        shell: wsl-bash {0}
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          # What crosses into WSL, the two paths translated (`/p`).
          WSLENV: TARBALL:RUNNER_TEMP/p:GITHUB_WORKSPACE/p
        run: |
          # Node from nodejs.org: Ubuntu's own is older than the 22.15 floor.
          curl -fsSL https://nodejs.org/dist/v24.11.0/node-v24.11.0-linux-x64.tar.xz -o /tmp/node.tar.xz
          mkdir -p /opt/node && tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
          export PATH=/opt/node/bin:$PATH
          node --version
          # The Windows side's files, copied onto the Linux disk where the work happens.
          cp "$RUNNER_TEMP/pack/$TARBALL" /tmp/
          cp -r "$GITHUB_WORKSPACE/tools/door" /tmp/door-tool
          cd /tmp && COUNTERPARTS_REQUIRE_EXPLICIT_DIR=1 node /tmp/door-tool/npm-door.mjs "/tmp/$TARBALL" /tmp/npm-door
